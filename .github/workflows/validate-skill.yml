name: Validate C-ITS Expert Skill

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to the commit of the release tag (checkout v4, setup-python v5,
# upload-artifact v4) so a moved tag cannot change what runs.
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Developers and users are on Windows: paths, symlinks, line endings, stdin.
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The tools are installed (not merely imported from the checkout) so their
      # console entry points — cits-lint, cits-mcp, cits-export — exist exactly as
      # a user gets them, and the tests can exercise the real commands. The asn1 extra
      # is required: without it the R06/ASN.1 tests skip and the coverage gate fails.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[asn1,dev]" pyyaml pip-audit

      - name: Audit dependencies for known vulnerabilities
        if: runner.os == 'Linux'
        run: pip-audit --skip-editable

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy cits_validator

      - name: Run test suite with coverage gate
        run: pytest -q -rs --cov=cits_validator --cov-report=term --cov-report=xml --cov-fail-under=85 | tee pytest.out

      - name: Security-relevant packages keep a higher coverage floor
        run: coverage report --include="cits_validator/mcp/*" --fail-under=90

      - name: No unexpected skipped tests (a missing extra must not silently remove tests)
        if: runner.os == 'Linux'
        run: |
          if grep -q "^SKIPPED" pytest.out; then
            echo "::error::Tests were skipped on Linux; the optional extras must be installed in CI."
            grep "^SKIPPED" pytest.out
            exit 1
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Console entry points are installed
        run: |
          cits-lint --version
          cits-lint . --format json > /dev/null

      - name: Self-audit must be clean (anti-hallucination rule R02)
        run: |
          cits-lint cits_validator/ --rules R02 --format json > r02.json
          python scripts/check_r02_self_audit.py r02.json

      - name: Vendored skill copies are in sync
        run: |
          if ! python sync_skill.py --check --quiet; then
            echo "::error::A vendored copy of the cits-expert skill has drifted from the repository."
            echo "Run 'python sync_skill.py --install-global' and commit the result."
            exit 1
          fi

  standards:
    # The ASN.1 conformance core compiles real ETSI/ISO modules. It is a separate
    # job because the standards corpus is vendored, not committed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install with the ASN.1 extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[asn1,dev]"
      - name: ASN.1 conformance tests
        run: pytest tests/asn1 -q

  edge-zipapp:
    # The device profile must run with zero third-party dependencies. This job
    # deliberately installs WITHOUT the asn1 extra and runs the built zipapp.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the cits-edge zipapp (no install, no third-party packages)
        run: python scripts/build_edge_zipapp.py --output cits-edge.pyz
      - name: Checksum matches the archive
        run: sha256sum -c cits-edge.pyz.sha256
      - name: Archive contains only the package
        run: |
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("cits-edge.pyz").namelist()
          stray = [n for n in names if n != "__main__.py" and not n.startswith("cits_validator/")]
          assert not stray, stray
          assert not any("asn1tools" in n or n.endswith(".asn") for n in names)
          PY
      - name: Device-profile smoke test (selftest, isolated interpreter)
        run: python -I cits-edge.pyz selftest
      - name: MCP stdio round trip over the zipapp
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | CITS_MCP_ROOTS="$PWD" python -I cits-edge.pyz | grep -q cits_selftest
      - name: Upload the zipapp and its checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cits-edge
          path: |
            cits-edge.pyz
            cits-edge.pyz.sha256
