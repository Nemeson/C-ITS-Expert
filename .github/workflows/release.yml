name: Release

# Runs when a GitHub release is published (tag vX.Y.Z). It builds the sdist, wheel and
# cits-edge zipapp from the tagged commit, attaches signed provenance, uploads the files to
# the release and - only when the repository variable PUBLISH_PYPI is "true" - publishes to
# PyPI via Trusted Publishing (no API token is stored anywhere).
#
# One-time setup for PyPI: create the project on pypi.org, add this repository + workflow
# (release.yml) + environment "pypi" as a Trusted Publisher, then set the repository
# variable PUBLISH_PYPI=true.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build "setuptools>=83"
          python -m build
      - name: Build the cits-edge zipapp
        run: python scripts/build_edge_zipapp.py --output dist/cits-edge.pyz
      - name: Checksums verify
        run: cd dist && sha256sum -c cits-edge.pyz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # keyless signing
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/cits-edge.pyz
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Keep only the PyPI distributions
        run: rm -f dist/cits-edge.pyz dist/cits-edge.pyz.sha256
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
