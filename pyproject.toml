[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cits-expert"
version = "1.5.0"
description = "Universal C-ITS & V2X Knowledge, Dissection, and Engineering Skill Suite for AI Agents"
readme = "README.md"
authors = [{ name = "Kevin Seipel", email = "vertrieb@seipel.uk" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["cits_validator*"]

[tool.setuptools.package-data]
cits_validator = ["asn1/standards/**/*.asn", "asn1/standards/*.json", "asn1/standards/LICENSE-ETSI.txt"]

[project.scripts]
cits-lint = "cits_validator.cli.main:main"
cits-mcp = "cits_validator.mcp.server:main"
cits-export = "cits_validator.cli.export:main"

[project.optional-dependencies]
# ASN.1/UPER conformance core (rule R06). Optional so the link-layer,
# anti-hallucination and topology rules stay dependency-free and stream with a
# small footprint; only PDU decoding needs a third-party ASN.1 compiler.
asn1 = [
    "asn1tools>=0.167",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "PT", "UP"]
ignore = [
    "E501",
    "UP042",  # Severity(str, Enum): StrEnum would change str() output used in reports
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, spawn the project's own scripts, use seeded PRNGs for fuzzing and
# use obviously fake tokens / bind addresses as inputs.
"tests/**" = ["S314", "PT011", "PT017", "PT018", "S101", "S105", "S104", "S311", "S603", "S607"]
"scripts/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
    "integration: tests that spawn subprocesses or build artifacts",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    # asn1tools parses its grammar with an older pyparsing API; the warnings are
    # noise from a dependency, not a signal about this code.
    "ignore::DeprecationWarning:asn1tools.*",
    "ignore::DeprecationWarning:pyparsing.*",
]

[tool.coverage.run]
branch = true
source = ["cits_validator"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
ignore_missing_imports = true

# Code that parses client input must be fully typed.
[[tool.mypy.overrides]]
module = ["cits_validator.mcp.*"]
disallow_untyped_defs = true
