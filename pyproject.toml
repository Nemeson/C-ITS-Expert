[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cits-expert"
version = "1.1.0"
description = "Universal C-ITS & V2X Knowledge, Dissection, and Engineering Skill Suite for AI Agents"
readme = "README.md"
authors = [{ name = "Kevin Seipel", email = "vertrieb@seipel.uk" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["cits_validator*"]

[project.scripts]
cits-lint = "cits_validator.cli.main:main"
cits-mcp = "cits_validator.mcp.server:main"
cits-export = "cits_validator.cli.export:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
